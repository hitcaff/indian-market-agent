name: EOD P&L & Learning

on:
  schedule:
    - cron: '30 10 * * 1-5'   # 4:00 PM IST (Mon-Fri)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests python-dotenv
      - name: Run EOD P&L
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python eod_pnl.py
      - name: Run Learning
        run: python learning.py
      - name: Commit updated data
        run: |
          git config user.name "market-bot"
          git config user.email "bot@market.ai"
          git add data/
          git diff --cached --quiet || git commit -m "eod: $(date +'%Y-%m-%d')"
          git push
